plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.trainrecruits'

base {
    archivesName = 'trainrecruits-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                trainrecruits {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', 'trainrecruits'
        }
        server {
            property 'forge.enabledGameTestNamespaces', 'trainrecruits'
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Jars of the mods we integrate with live in ./libs
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    // Mods we integrate with (file name must be <name>-<version>.jar in ./libs)
    implementation fg.deobf('blank:create-1.20.1:6.0.8')
    implementation fg.deobf('blank:recruits-1.20.1:1.15.2')

    // Libraries bundled inside Create (Flywheel, Ponder, Registrate...). Only needed so javac can resolve Create's class hierarchy.
    compileOnly fileTree(dir: 'libs/create-deps', include: ['*.jar'])
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : 'trainrecruits',
                'Specification-Vendor'  : 'trainrecruits',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : 'trainrecruits'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
